<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#2b1d22;--mut:#8a747b;--pri:#d6336c;--pri2:#fce4ec;--line:#f1d9e0;--ok:#2f9e44}

body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}

.tr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.tr span{flex:1}.tr .off{opacity:.45}
.tr button{border:0;background:var(--pri2);color:var(--pri);border-radius:8px;padding:8px 10px;font-size:14px}
#fiBg{position:fixed;inset:0;background:#0006;z-index:11;display:none}
#fi{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#fi img{width:100%;max-height:240px;object-fit:cover;border-radius:22px 22px 0 0;background:var(--pri2);display:block}
#fi .bd{padding:14px}

.row .inf,.row img{cursor:pointer}
#adm{width:100%;height:calc(100dvh - 170px);border:0;border-radius:14px;background:var(--bg);display:block}
.tr span{min-width:0}.tr button{min-width:42px}
#oc:empty{display:none}
img.th,i.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--pri2);flex:none;display:block}
.th2{width:26px;height:26px;border-radius:6px;object-fit:cover;background:var(--pri2)}
.fs{display:flex;gap:3px;flex:none}
.oc.cobrado{border-left-color:var(--mut)}.oc.cancelado{border-left-color:#adb5bd;opacity:.7}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none;font-size:14px;max-width:90%}
.oc{border-radius:16px;box-shadow:0 1px 4px #d6336c14}
.oc .h{align-items:center;font-size:19px}
.oc .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:#fff3bf;color:#b35c00}
.pill.preparando{background:#d0ebff;color:#1864ab}.pill.entregado{background:#d3f9d8;color:#2b8a3e}
.oc .li{align-items:flex-start;padding:5px 0;border-top:1px solid #f8eaee}.oc .li:first-of-type{border-top:0}
.q{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:8px;padding:1px 7px;margin-right:6px;font-weight:800}

.oc .bt .go{flex:3;font-size:16px}.oc .bt .no{background:#fff;color:var(--mut);border:1px solid var(--line)}
.ofs{padding:0 0 6px}
#mseg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
#mseg button{padding:12px 2px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px}
#mseg button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
#dlgBg{position:fixed;inset:0;background:#2b1d2299;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#dlg{background:#fff;border-radius:20px;padding:22px 20px 16px;width:100%;max-width:340px;box-shadow:0 10px 40px #0004;animation:pop .15s ease-out}

#dlg h3{margin:0 0 6px;font-size:19px}#dlg p{margin:0 0 18px;color:var(--mut);font-size:15px;line-height:1.4}
#dlg .dbt{display:flex;gap:8px}#dlg .dbt button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:700}
#dlg .dn{background:var(--pri2);color:var(--pri)}#dlg .dy{background:var(--pri);color:#fff}#dlg .dy.danger{background:#e03131}
#mesas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
#mesas button{position:relative;padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:700;color:var(--ink)}
#mesas button.on{background:var(--pri);border-color:var(--pri);color:#fff}
#mesas button.occ::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#f08c00}
#mesas small{grid-column:1/-1;color:var(--mut);font-size:12px}
.bt2{display:flex;gap:8px;margin-top:8px}.bt2 button{flex:1;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:10px;padding:9px 4px;font-size:14px;font-weight:600}
#tk{display:none}
@page{size:80mm auto;margin:3mm}
@media print{body>*:not(#tk){display:none!important}body>#tk{display:block!important;width:72mm;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#000;background:#fff}
#tk h1{font-size:20px;text-align:center;margin:0 0 4px}#tk .c{text-align:center}#tk hr{border:0;border-top:1px dashed #000;margin:6px 0}
#tk .r{display:flex;justify-content:space-between;gap:8px}#tk .n{padding-left:18px;font-size:12px}#tk .t{font-size:17px;font-weight:700}}
#undo{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 8px 8px 16px;z-index:25;display:none;align-items:center;gap:14px;font-size:15px;max-width:92%;box-shadow:0 6px 24px #0005}

#payBg{position:fixed;inset:0;background:#2b1d2299;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#pay{background:#fff;border-radius:20px;padding:22px 20px 16px;width:100%;max-width:340px;box-shadow:0 10px 40px #0004;animation:pop .15s ease-out}
#pay h3{margin:0 0 2px;font-size:19px}#pay .pt{font-size:32px;font-weight:800;color:var(--pri);margin:2px 0 6px}#pay p{margin:0 0 10px;color:var(--mut)}
.pm{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;font-size:17px;font-weight:700;margin-bottom:8px}
.pmx{width:100%;border:0;background:none;color:var(--mut);padding:10px;font-size:15px;font-weight:600}
.test{border-color:#e03131;margin-top:14px}.test h3{color:#e03131;margin:0 0 4px}.test small{display:block;color:var(--mut);margin-bottom:8px}
.test button{display:block;width:100%;border:1px solid #e03131;background:#fff;color:#e03131;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin-top:8px}
.test button.all{background:#e03131;color:#fff}.test button:disabled{opacity:.5}
#pay input{width:100%;font-size:26px;font-weight:800;padding:12px 14px;border:2px solid var(--line);border-radius:14px;outline:none;text-align:center}
#pay input:focus{border-color:var(--pri)}
.qk{display:flex;gap:6px;margin:8px 0}
.qk button{flex:1;border:1px solid var(--line);background:var(--pri2);color:var(--pri);border-radius:12px;padding:11px 2px;font-size:15px;font-weight:700}
.chg{text-align:center;font-size:24px;font-weight:800;margin:6px 0 12px;color:var(--mut)}
.chg.ok{color:var(--ok)}.chg.no{color:#e03131;font-size:18px}
.pm.go{text-align:center;background:var(--ok);border-color:var(--ok);color:#fff}
.pm.go:disabled{background:#b8c9bc;border-color:#b8c9bc}
.cr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #f8eaee;font-size:15px}.cr small{color:var(--mut)}
.cs{width:100%;margin-top:10px;border:1px solid var(--line);background:#fff;color:var(--pri);border-radius:12px;padding:11px;font-size:15px;font-weight:700}
.tab{position:relative;white-space:nowrap}
.tab b{position:absolute;top:-6px;right:-3px;min-width:20px;height:20px;line-height:16px;padding:0 5px;text-align:center;background:var(--pri);color:#fff;border:2px solid #fff;border-radius:10px;font-size:11px}
.tab b:empty{display:none}.tab.on b{background:#fff;color:var(--pri);border-color:var(--pri)}
.tr .sw{min-width:54px;width:54px;height:30px;padding:0;border-radius:15px;position:relative;background:#ced4da;transition:background .15s}
.tr .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .15s}

.dch{display:flex;gap:6px;flex-wrap:wrap}.dch button{flex:1;min-width:30%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 6px;font-size:15px;font-weight:700}
.dch button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.dl{margin:8px 2px 0;color:var(--mut);font-size:14px;text-transform:capitalize}
#calBg{position:fixed;inset:0;background:#2b1d2299;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#cal{background:#fff;border-radius:20px;padding:16px;width:100%;max-width:340px;box-shadow:0 10px 40px #0004;animation:pop .15s ease-out}
.cch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:17px;text-transform:capitalize}
.cch button{width:42px;height:42px;border:0;border-radius:12px;background:var(--pri2);color:var(--pri);font-size:20px;font-weight:800}.cch button:disabled{opacity:.3}
.cwd,.cdd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cwd{font-size:12px;color:var(--mut);margin-bottom:4px}

<body>
<header>
  <div class="tabs"><button class="tab on" data-v="menu">Menú</button><button class="tab" data-v="ords">Pedidos <b id="oc"></b></button><button class="tab" data-v="his">Historial</button><button class="tab" data-v="aj">Ajustes</button></div>

</header>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, collection, onSnapshot, addDoc, updateDoc, setDoc, deleteDoc, getDocs, writeBatch, doc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCOqdSCerlqBgpMoanrGbzRbtfo1P0VGU4",
  authDomain: "fresas-d8664.firebaseapp.com",
  projectId: "fresas-d8664",
  storageBucket: "fresas-d8664.firebasestorage.app"
});
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); }
catch (e) { db = initializeFirestore(app, {}); }

const CATS = { crepes:'Crepas', waffles:'Waffles', pancakes:'Pancakes', frappes:'Frappes', fresas:'Fresas', smoothies:'Smoothies', bebidas:'Bebidas', combos:'Combos' };
const $ = id => document.getElementById(id);
const fmt = n => 'MX$' + Number(n || 0).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const img = v => !v ? 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E' : (/^(https?:|data:)/i.test(v) ? v : './' + v);

let all = [], products = [], cat = 'todos', tipo = 'local';
let cart = {}; // id -> {id,nombre,precio,cant,nota}
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); $('mes').value = localStorage.getItem('mesero') || ''; } catch (e) {}
const save = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };

function ask(title, msg, ok = 'Aceptar', cancel = 'Cancelar', danger = false) {
  return new Promise(res => {
    $('dt').textContent = title; $('dm').textContent = msg; $('dy').textContent = ok; $('dn').textContent = cancel;
    $('dy').className = 'dy' + (danger ? ' danger' : ''); $('dlgBg').style.display = 'flex';
    const end = v => { $('dlgBg').style.display = 'none'; res(v); };
    $('dy').onclick = () => end(true); $('dn').onclick = () => end(false);
    $('dlgBg').onclick = e => { if (e.target.id === 'dlgBg') end(false); };
  });
}
const MESEROS = ['Axel', 'Alan', 'Liz', 'Dany', 'Erick'];
function renderMes() {
  const cur = $('mes').value, l = cur && !MESEROS.includes(cur) ? [...MESEROS, cur] : MESEROS;
  $('mseg').style.gridTemplateColumns = `repeat(${Math.min(l.length, 5)},1fr)`;
  $('mseg').innerHTML = l.map(n => `<button type="button" data-w="${esc(n)}" class="${n === cur ? 'on' : ''}">${esc(n)}</button>`).join('');
}
const ESTN = { pendiente: 'nuevo', preparando: 'en preparación', entregado: 'por cobrar', cobrado: 'cobrado', cancelado: 'cancelado' };
function undo(msg, fn) {
  const u = $('undo'), sp = document.createElement('span'), b = document.createElement('button');
  sp.textContent = msg; b.textContent = '↩ Deshacer'; u.replaceChildren(sp, b); u.style.display = 'flex';
  clearTimeout(undo.t); undo.t = setTimeout(() => u.style.display = 'none', 6000);
  b.onclick = () => { clearTimeout(undo.t); u.style.display = 'none'; fn(); toast('Deshecho ✓'); };
}
const MP = { efectivo: '💵 Efectivo', tarjeta: '💳 Tarjeta' };
function payAsk(o) {
  return new Promise(res => {
    const bg = $('payBg'), box = $('pay'), total = Number(o.total) || 0, cents = n => Math.round(Number(n) * 100);
    const close = v => { bg.style.display = 'none'; bg.onclick = null; res(v); };
    const step1 = () => {
      box.innerHTML = `<h3>Cobrar · ${esc(o.cliente)}</h3><div class="pt">${fmt(total)}</div><p>¿Cómo pagó?</p>` +
        Object.entries(MP).map(([k, t]) => `<button class="pm" data-m="${k}">${t}</button>`).join('') + '<button class="pmx" data-m="">Cancelar</button>';
      bg.style.display = 'flex';
      bg.onclick = e => {
        const m = e.target.dataset.m;
        if (m === undefined) { if (e.target.id === 'payBg') close(null); return; }
        if (m === 'efectivo') return step2();
        close(m ? { m } : null);
      };
    };
    const step2 = () => {
      const quick = [20, 50, 100, 200, 500, 1000].filter(d => cents(d) > cents(total)).slice(0, 3);
      box.innerHTML = `<h3>💵 Efectivo · ${esc(o.cliente)}</h3><div class="pt">${fmt(total)}</div><p>¿Con cuánto paga?</p>` +
        `<input id="rec" type="number" inputmode="decimal" min="0" step="any" placeholder="Recibí MX$" autocomplete="off">` +
        `<div class="qk"><button data-q="${total}">Exacto</button>${quick.map(d => `<button data-q="${d}">$${d}</button>`).join('')}</div>` +
        `<div class="chg" id="chg">Cambio: —</div><button class="pm go" id="pok" data-ok="1" disabled>Confirmar cobro</button><button class="pmx" data-back="1">← Volver</button>`;
      const inp = $('rec'), chg = $('chg'), ok = $('pok');
      const upd = () => {
        const v = inp.value;
        if (v === '' || isNaN(Number(v))) { chg.className = 'chg'; chg.textContent = 'Cambio: —'; ok.disabled = true; return; }
        const d = cents(v) - cents(total);
        if (d < 0) { chg.className = 'chg no'; chg.textContent = `Faltan ${fmt(-d / 100)}`; ok.disabled = true; }
        else { chg.className = 'chg ok'; chg.textContent = `Cambio: ${fmt(d / 100)}`; ok.disabled = false; }
      };
      inp.oninput = upd;
      bg.onclick = e => {
        const d = e.target.dataset;
        if (d.q !== undefined) { inp.value = d.q; upd(); return; }
        if (d.back) return step1();
        if (d.ok) { const r = Number(inp.value); if (inp.value !== '' && cents(r) >= cents(total)) close({ m: 'efectivo', recibido: r, cambio: (cents(r) - cents(total)) / 100 }); return; }
        if (e.target.id === 'payBg') close(null);
      };
      inp.focus();
    };
    step1();
  });
}
async function adv(o) {
  const prev = o.estado, nx = SIG[prev][1], ref = doc(db, 'comandas', o.id);
  if (nx === 'cobrado') {
    const p = await payAsk(o); if (!p) return;
    const efe = p.m === 'efectivo';
    updateDoc(ref, { estado: 'cobrado', metodoPago: p.m, cobradoEn: serverTimestamp(), recibido: efe ? p.recibido : null, cambio: efe ? p.cambio : null });
    undo(`${o.cliente}: cobrado · ${MP[p.m]}${efe && p.cambio > 0 ? ' · cambio ' + fmt(p.cambio) : ''}`, () => updateDoc(ref, { estado: prev, metodoPago: null, cobradoEn: null, recibido: null, cambio: null }));
    return;
  }
  updateDoc(ref, { estado: nx });
  undo(`${o.cliente}: ${ESTN[nx]}`, () => updateDoc(ref, { estado: prev }));
}
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

onSnapshot(collection(db, 'productos'), snap => {
  all = snap.docs.map(d => ({ id: d.id, ...d.data() })); products = all.filter(p => p.activo !== false);
  products.forEach(p => { p._n = norm(p.nombre).split(/\s+/); p._d = norm(p.descripcion).split(/[\s,.;]+/); p._f = norm(p.nombre); });
  renderChips(); if (view === 'menu') render(); decAdm();
}, () => { $('list').innerHTML = '<div class="empty">No se pudo cargar el menú. Revisa tu conexión.</div>'; });

const th = (src, c = 'th') => src ? `<img class="${c}" src="${esc(img(src))}" alt="" loading="lazy">` : '';
const thp = src => src ? th(src) : '<i class="th"></i>';
const pic = i => i.img ? th(i.img) : (i.fotos?.length ? `<span class="fs">${i.fotos.slice(0, 4).map(f => th(f, 'th2')).join('')}</span>` : '');
const notas = n => n ? n.split(' · ').map(p => { const k = p.indexOf(':'); return `<small>${k > 0 ? `<b>${esc(p.slice(0, k + 1))}</b>${esc(p.slice(k + 1))}` : esc(p)}</small>`; }).join('') : '';
const lines = o => (o.items || []).map(i => `<div class="li">${i.img ? `<div class="lth">${th(i.img)}</div>` : ''}<div class="lb"><div class="lr"><span><b class="q">${i.cant}×</b>${esc(i.nombre)}</span><b class="lpz">${fmt(i.cant * i.precio)}</b></div>${notas(i.nota)}${i.fotos?.length ? pic({ fotos: i.fotos }) : ''}</div></div>`).join('');
let orders = [], view = 'menu', editId = null;
const SIG = { pendiente: ['▶ Empezar a preparar', 'preparando'], preparando: ['✓ Marcar entregado', 'entregado'], entregado: ['💲 Cobrar', 'cobrado'] };
const ST = { pendiente: 'Nuevo', preparando: 'Preparando', entregado: 'Por cobrar' };
let oSt = 'todos';
const ago = o => { const t = o.creadoEn?.seconds; if (!t) return 'ahora'; const m = Math.max(0, Math.round((Date.now() / 1000 - t) / 60)); return m < 1 ? 'ahora' : m < 60 ? `hace ${m} min` : `hace ${Math.floor(m / 60)} h ${m % 60} min`; };
setInterval(() => { if (view === 'ords') renderOrds(); }, 30000);
const hora = o => o.creadoEn?.toDate ? o.creadoEn.toDate().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';
onSnapshot(query(collection(db, 'comandas'), where('estado', 'in', ['pendiente', 'preparando', 'entregado'])), snap => {
  orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.creadoEn?.seconds ?? 9e9) - (b.creadoEn?.seconds ?? 9e9));
  $('oc').textContent = orders.length || '';
  if (view === 'ords') renderOrds();
});
const qx = () => { $('clr').style.display = $('q').value ? '' : 'none'; };
$('q').addEventListener('input', qx); $('clr').addEventListener('click', () => setTimeout(qx));
qx();
// limpieza: si algún dispositivo llegó a registrar la versión instalable, se desactiva
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister())).catch(() => {});
if (window.caches) caches.delete('comandas-v1').catch(() => {});
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let hist = [], hDay = ymd(new Date()), hUnsub = null;
function listenHis() {
  if (hUnsub) hUnsub();
  const a = new Date(hDay + 'T00:00:00'), b = new Date(a.getTime() + 864e5);
  hUnsub = onSnapshot(query(collection(db, 'comandas'), where('creadoEn', '>=', a), where('creadoEn', '<', b)), snap => {
    hist = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => o.estado === 'cobrado' || o.estado === 'cancelado').sort((x, y) => (y.creadoEn?.seconds ?? 0) - (x.creadoEn?.seconds ?? 0));
    if (view === 'his') renderHis();
  });
}
let corteOpen = false;
function calcCorte() {
  const ok = hist.filter(o => o.estado === 'cobrado'), tot = ok.reduce((x, o) => x + (o.total || 0), 0);
  const by = kf => { const m = {}; ok.forEach(o => { const k = kf(o); (m[k] = m[k] || { n: 0, t: 0 }); m[k].n++; m[k].t += o.total || 0; }); return m; };
  return { ok, tot, pm: by(o => o.metodoPago || 'sin'), mz: Object.entries(by(o => o.mesero || 'Sin mesero')).sort((a, b) => b[1].t - a[1].t), canc: hist.filter(o => o.estado === 'cancelado').length };
}
function corteHtml() {
  const c = calcCorte(); if (!c.ok.length) return '';
  const row = (n, v, sm) => `<div class="cr"><span>${n}${sm ? ` <small>${sm}</small>` : ''}</span><b>${fmt(v)}</b></div>`;
  const pm = c.pm;
  return `<details class="aj corte"${corteOpen ? ' open' : ''}><summary>📊 Corte del día <small>ver detalle ›</small></summary>${row('Ticket promedio', c.tot / c.ok.length, c.ok.length + ' pedidos')}
    <h3 style="margin-top:12px">Por método de pago</h3>${Object.entries(MP).map(([k, t]) => row(t, pm[k]?.t || 0, (pm[k]?.n || 0) + '')).join('')}${pm.sin ? row('Sin registrar', pm.sin.t, pm.sin.n + '') : ''}
    <h3 style="margin-top:12px">Por mesero</h3>${c.mz.map(([n, v]) => row(esc(n), v.t, v.n + ' pedidos')).join('')}
    ${c.canc ? `<div class="cr"><span>Cancelados</span><b>${c.canc}</b></div>` : ''}<button class="cs" data-cs="1">📤 Compartir corte</button></details>`;
}
function corteTxt() {
  const c = calcCorte(), l = [`🍓 Berry Sweet · Corte ${hDay}`, `Total: ${fmt(c.tot)} (${c.ok.length} pedidos)`, '', 'Método de pago:'];
  Object.entries(MP).forEach(([k, t]) => l.push(`${t}: ${fmt(c.pm[k]?.t || 0)}`)); if (c.pm.sin) l.push(`Sin registrar: ${fmt(c.pm.sin.t)}`);
  l.push('', 'Meseros:'); c.mz.forEach(([n, v]) => l.push(`${n}: ${fmt(v.t)} (${v.n})`)); return l.join('\n');
}
$('his').addEventListener('toggle', e => { if (e.target.classList?.contains('corte')) corteOpen = e.target.open; }, true);
function renderHis() {
  const ok = hist.filter(o => o.estado === 'cobrado'), tot = ok.reduce((x, o) => x + (o.total || 0), 0);
  $('his').innerHTML = `<div class="aj">${dateBar()}<div class="tot" style="margin:10px 0 0"><span>Cobrado (${ok.length})</span><span>${fmt(tot)}</span></div></div>` + corteHtml() +
    (hist.length ? hist.map(o => `<div class="oc ${o.estado}"><div class="h"><span>${esc(o.cliente)}</span><span class="tg">${o.estado === 'cancelado' ? 'Cancelado' : (o.tipo === 'llevar' ? 'Para llevar' : 'Aquí')}</span></div>
      <div class="m">${hora(o)} · ${esc(o.mesero || 'sin mesero')}</div>${lines(o)}${o.metodoPago === 'efectivo' && o.recibido != null ? `<div class="m">💵 Recibió ${fmt(o.recibido)} · Cambio ${fmt(o.cambio)}</div>` : ''}
      <div class="t"><span>Total</span><span>${fmt(o.total)}</span></div><div class="bt"><button data-r="${o.id}">Reabrir</button></div></div>`).join('') : '<div class="empty">Sin pedidos terminados este día</div>') + testHtml();
}
const TEST_MODE = true; // ⚠ poner en false antes de usar la app con clientes reales: oculta los botones de borrado
const testHtml = () => !TEST_MODE ? '' : `<div class="aj test"><h3>🧪 Zona de pruebas</h3><small>Borra datos de Firebase. No se puede deshacer.</small>
  <button data-wipe="ped">Borrar pedidos y cortes</button><button class="all" data-wipe="all">Borrar TODA la base de datos</button></div>`;
const WIPE = { ped: { cols: ['comandas'], t: '¿Borrar todos los pedidos?', m: 'Se eliminan los pedidos activos, el historial y los cortes de todos los días. Productos y opciones se quedan.' },
  all: { cols: ['comandas', 'productos', 'toppings'], t: '¿Borrar TODA la base de datos?', m: 'Se eliminan pedidos, cortes, productos y opciones de armado (toppings, coberturas, cremas).' } };
async function wipeDb(k) {
  const w = WIPE[k]; if (!w || !TEST_MODE) return;
  if (!(await ask(w.t, w.m + ' No se puede deshacer.', 'Continuar', 'Volver', true))) return;
  if ((prompt('Para confirmar escribe BORRAR') || '').trim().toUpperCase() !== 'BORRAR') { toast('No se borró nada'); return; }
  toast('Borrando…');
  try {
    let n = 0;
    for (const c of w.cols) {
      const snap = await getDocs(collection(db, c));
      for (let i = 0; i < snap.docs.length; i += 400) { const b = writeBatch(db); snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      n += snap.size;
    }
    editId = null; toast(`Listo: ${n} registros borrados ✓`);
  } catch (err) { toast('No se pudo borrar. Revisa la conexión o las reglas de Firebase.'); }
}
const dLbl = k => new Date(k + 'T12:00:00').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
function dateBar() {
  const n = i => ymd(new Date(Date.now() - i * 864e5)), q = [[n(0), 'Hoy'], [n(1), 'Ayer'], [n(2), 'Antes de ayer']];
  const otra = !q.some(([k]) => k === hDay);
  return '<div class="dch">' + q.map(([k, t]) => `<button data-d="${k}" class="${k === hDay ? 'on' : ''}">${t}</button>`).join('') +
    `<button data-cal="1" class="${otra ? 'on' : ''}">📅 ${otra ? new Date(hDay + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : 'Otra fecha'}</button></div><div class="dl">${dLbl(hDay)}</div>`;
}
function setDay(k) { hDay = k; hist = []; listenHis(); renderHis(); }
let cm = null;
function openCal() { const [y, m] = hDay.split('-').map(Number); cm = new Date(y, m - 1, 1); drawCal(); $('calBg').style.display = 'flex'; }
function drawCal() {
  const y = cm.getFullYear(), m = cm.getMonth(), off = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate(), hoy = ymd(new Date());
  const cells = Array.from({ length: off }, () => '<span></span>').concat(Array.from({ length: nd }, (_, i) => { const k = ymd(new Date(y, m, i + 1)); return `<button data-cd="${k}" class="${k === hDay ? 'on' : ''}${k === hoy ? ' hoy' : ''}"${k > hoy ? ' disabled' : ''}>${i + 1}</button>`; }));
  const futuro = ymd(new Date(y, m + 1, 1)) > hoy;
  $('cal').innerHTML = `<div class="cch"><button data-cm="-1" aria-label="Mes anterior">‹</button><b>${cm.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' })}</b><button data-cm="1" aria-label="Mes siguiente"${futuro ? ' disabled' : ''}>›</button></div>
    <div class="cwd">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<span>${d}</span>`).join('')}</div><div class="cdd">${cells.join('')}</div><button class="pmx" data-cx="1">Cerrar</button>`;
}
$('calBg').onclick = e => {
  const t = e.target;
  if (t.dataset.cm) { cm = new Date(cm.getFullYear(), cm.getMonth() + Number(t.dataset.cm), 1); drawCal(); }
  else if (t.dataset.cd) { $('calBg').style.display = 'none'; setDay(t.dataset.cd); }
  else if (t.dataset.cx || t.id === 'calBg') $('calBg').style.display = 'none';
};
$('his').onclick = e => {
  if (e.target.dataset.wipe) { wipeDb(e.target.dataset.wipe); return; }
  if (e.target.dataset.d) { setDay(e.target.dataset.d); return; }
  if (e.target.dataset.cal) { openCal(); return; }
  if (e.target.dataset.cs) { const t = corteTxt(); if (navigator.share) navigator.share({ text: t }).catch(() => {}); else window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank'); return; }
  const r = e.target.dataset.r; if (r) { updateDoc(doc(db, 'comandas', r), { estado: 'entregado', metodoPago: null, cobradoEn: null, recibido: null, cambio: null }); toast('Pedido reabierto'); } };
function renderOrds() {
  const n = k => orders.filter(o => o.estado === k).length;
  const chips = [['todos', 'Todos', orders.length], ['pendiente', 'Nuevos', n('pendiente')], ['preparando', 'Preparando', n('preparando')], ['entregado', 'Por cobrar', n('entregado')]]
    .map(([k, t, c]) => `<button class="chip${k === oSt ? ' on' : ''}" data-os="${k}">${t} · ${c}</button>`).join('');
  const l = orders.filter(o => oSt === 'todos' || o.estado === oSt);
  $('ords').innerHTML = `<div class="chips ofs">${chips}</div>` + (l.length ? l.map(o => `<div class="oc ${o.estado}">
    <div class="h"><span>${esc(o.cliente)}</span><span class="tg">${o.tipo === 'llevar' ? '🛍 Para llevar' : '🍽 Aquí'}</span></div>
    <div class="m"><span class="pill ${o.estado}">${ST[o.estado]}</span><span>${hora(o)} · ${ago(o)}</span><span>· ${esc(o.mesero || 'sin mesero')}</span></div>
    ${lines(o)}

function search() {
  const toks = norm($('q').value).split(/\s+/).filter(Boolean);
  let res = products.filter(p => cat === 'todos' || p.categoria === cat);
  if (!toks.length) return res.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
  const out = [];
  for (const p of res) {
    let score = 0, ok = true;
    for (const t of toks) {
      if (p._n.some(w => w.startsWith(t))) score += 3;
      else if (p._f.includes(t)) score += 2;
      else if (p._d.some(w => w.startsWith(t))) score += 1;
      else { ok = false; break; }
    }
    if (ok) out.push([score + (p._f.startsWith(toks[0]) ? 2 : 0), p]);
  }
  return out.sort((a, b) => b[0] - a[0]).map(x => x[1]);
}

function ticket(o, act) {
  const f = o.creadoEn?.toDate ? o.creadoEn.toDate() : new Date();
  const fh = f.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) + ' ' + f.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  const ti = o.tipo === 'llevar' ? 'Para llevar' : 'Aquí';
  if (act === 'print') {
    let t = $('tk'); if (!t) { t = document.createElement('div'); t.id = 'tk'; document.body.appendChild(t); }
    t.innerHTML = `<h1>🍓 Berry Sweet</h1><div class="c"><b>${esc(o.cliente)}</b> · ${ti}</div><div class="c">${esc(o.mesero || '')} · ${fh}</div><hr>` +
      (o.items || []).map(i => `<div class="r"><span><b>${i.cant}×</b> ${esc(i.nombre)}</span><span>${fmt(i.cant * i.precio)}</span></div>${i.nota ? `<div class="n">${esc(i.nota)}</div>` : ''}`).join('') +
      `<hr><div class="r t"><span>TOTAL</span><span>${fmt(o.total)}</span></div>`;
    window.print(); return;
  }
  const txt = `🍓 Berry Sweet\n${o.cliente} · ${ti}\n${o.mesero ? 'Mesero: ' + o.mesero + ' · ' : ''}${fh}\n──────────\n` +
    (o.items || []).map(i => `${i.cant}× ${i.nombre}${i.nota ? '\n   ' + i.nota : ''}  ${fmt(i.cant * i.precio)}`).join('\n') + `\n──────────\nTotal: ${fmt(o.total)}`;
  if (navigator.share) navigator.share({ text: txt }).catch(() => {});
  else window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}
const NMESAS = 10; // número de mesas del local
function renderMesas() {
  const cur = $('cli').value.trim(), ocu = new Set(orders.filter(o => o.id !== editId).map(o => o.cliente));
  $('mesas').innerHTML = Array.from({ length: NMESAS }, (_, i) => { const n = 'Mesa ' + (i + 1); return `<button type="button" data-mz="${n}" class="${n === cur ? 'on' : ''}${ocu.has(n) ? ' occ' : ''}">${i + 1}</button>`; }).join('') + (orders.some(o => o.id !== editId && /^Mesa \d+$/.test(o.cliente)) ? '<small>● Mesa con pedido activo</small>' : '');
}
$('mesas').onclick = e => {
  const n = e.target.dataset.mz; if (!n) return;
  $('cli').value = $('cli').value.trim() === n ? '' : n; tipo = 'local';
  document.querySelectorAll('#tseg button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
  renderMesas();
};
$('cli').addEventListener('input', renderMesas);
function sheet() {
  renderMesas();
  const v = Object.values(cart);
  $('sh').textContent = editId ? 'Editar pedido' : 'Pedido'; $('send').textContent = editId ? 'Guardar cambios' : 'Enviar pedido'; $('vaciar').textContent = editId ? 'Cancelar edición' : 'Vaciar pedido';
  $('items').innerHTML = v.map(i => `<div class="it"><div class="l1" style="align-items:center"><span style="display:flex;gap:8px;align-items:center">${pic(i)}${esc(i.nombre)}</span><span>${fmt(i.cant * i.precio)}</span></div>
    <div class="qty"><button data-m="${i.id}">−</button><span>${i.cant}</span><button data-p="${i.id}">+</button><span style="color:var(--mut);font-weight:400;font-size:13px">${fmt(i.precio)} c/u</span>${i.arm ? `<button data-ea="${i.id}" style="width:auto;padding:0 12px;font-size:14px;margin-left:auto">✎ Cambiar</button>` : ''}</div>
    <input data-n="${i.id}" placeholder="Nota (sin crema, alergia…)" value="${esc(i.nota || '')}" maxlength="200"></div>`).join('');
  $('tot').textContent = fmt(totals().t);
  if (!v.length) { $('sheetBg').style.display = 'none'; }
  bar();
}

$('q').addEventListener('input', render);
$('clr').onclick = () => { $('q').value = ''; render(); $('q').focus(); };
$('chips').onclick = e => { const c = e.target.dataset.c; if (c) { cat = c; renderChips(); render(); } };
$('list').onclick = e => {
  if (e.target.closest('#armb')) { openArm(); return; }
  const row = e.target.closest('.row');
  if (row && !e.target.closest('[data-a]')) { openFi(row.dataset.p); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const p = products.find(x => x.id === b.dataset.a); if (!p) return;
  (cart[p.id] ||= { id: p.id, nombre: p.nombre, precio: Number(p.precio) || 0, cant: 0, nota: '', img: p.imagen || '' }).cant++;
  save(); render(); if (navigator.vibrate) navigator.vibrate(15);
};
$('open').onclick = () => { $('sheetBg').style.display = 'block'; sheet(); };
$('back').onclick = () => $('sheetBg').style.display = 'none';
$('sheetBg').onclick = e => { if (e.target.id === 'sheetBg') $('sheetBg').style.display = 'none'; };
$('items').onclick = e => {
  const m = e.target.dataset.m, p = e.target.dataset.p;
  if (e.target.dataset.ea) { editArm(e.target.dataset.ea); return; }
  if (p) cart[p].cant++;
  if (m && --cart[m].cant <= 0) delete cart[m];
  if (p || m) { save(); sheet(); render(); }
};
$('items').oninput = e => { const id = e.target.dataset.n; if (id && cart[id]) { cart[id].nota = e.target.value; save(); } };
$('tseg').onclick = e => {
  if (!e.target.dataset.t) return; tipo = e.target.dataset.t;
  document.querySelectorAll('#tseg button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
};
$('vaciar').onclick = async () => {
  if (editId) { editId = null; cart = {}; save(); $('cli').value = ''; $('sheetBg').style.display = 'none'; setView('ords'); return; }
  if (await ask('¿Vaciar el pedido?', 'Se quitarán todos los productos.', 'Vaciar', 'Volver', true)) { cart = {}; save(); sheet(); render(); }
};

$('mseg').onclick = e => { const w = e.target.dataset.w; if (w) { $('mes').value = w; try { localStorage.setItem('mesero', w); } catch (x) {} renderMes(); } };
renderMes();
$('send').onclick = async () => {
  const cliente = $('cli').value.trim(), mesero = $('mes').value.trim();
  if (!cliente) { toast('Escribe el cliente o la mesa'); $('cli').focus(); return; }
  if (!mesero) { toast('Elige quién atiende'); return; }
  const items = Object.values(cart).map(i => ({ nombre: i.nombre, precio: i.precio, cant: i.cant, nota: i.nota || '', img: i.img || '', fotos: i.fotos || [], arm: i.arm || null }));
  if (!items.length) return;
  $('send').disabled = true;
  try { localStorage.setItem('mesero', mesero); } catch (e) {}
  // Con caché offline, addDoc queda guardado y se sube solo al volver el internet
  const data = { cliente, tipo, mesero, items, total: totals().t };
  const fail = () => toast('No se pudo subir; se reintentará');
  if (editId) updateDoc(doc(db, 'comandas', editId), data).catch(fail);
  else addDoc(collection(db, 'comandas'), { ...data, estado: 'pendiente', creadoEn: serverTimestamp() }).catch(fail);
  const was = editId; editId = null;
  cart = {}; save(); $('cli').value = ''; $('sheetBg').style.display = 'none';
  $('send').disabled = false; toast(was ? 'Cambios guardados ✓' : 'Pedido enviado ✓');
  was ? setView('ords') : render();
};
</script>
</body>
</html>
