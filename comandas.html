<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comandas · Berry Sweet</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#2b1d22;--mut:#8a747b;--pri:#d6336c;--pri2:#fce4ec;--line:#f1d9e0;--ok:#2f9e44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.top{display:flex;gap:8px;align-items:center}
#q{flex:1;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:none;min-width:0}
#q:focus{border-color:var(--pri)}
.x{border:0;background:var(--pri2);color:var(--pri);border-radius:12px;width:44px;height:44px;font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{padding:10px 12px;max-width:640px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.row img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--pri2);flex:none}
.inf{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px}
.ds{color:var(--mut);font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pr{color:var(--pri);font-weight:700;font-size:14px;margin-top:2px}
.add{flex:none;position:relative;border:0;background:var(--pri);color:#fff;border-radius:12px;width:48px;height:48px;font-size:26px;line-height:1}
.add b{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--pri);border:2px solid var(--pri);border-radius:10px;font-size:12px;min-width:22px;height:22px;line-height:18px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
#bar button{width:100%;max-width:640px;display:flex;justify-content:space-between;margin:0 auto;border:0;background:var(--pri);color:#fff;font-size:17px;font-weight:700;padding:15px 18px;border-radius:16px}
#bar button:disabled{background:#d9c3ca}
#sheetBg{position:fixed;inset:0;background:#0006;z-index:10;display:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
h2{margin:0 0 10px;font-size:20px}
.it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.it .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:38px;height:38px;border:0;border-radius:10px;background:var(--pri2);color:var(--pri);font-size:22px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.it input,.f input{width:100%;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
.f{margin:12px 0}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px}
.seg button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:14px 0}
.send{width:100%;border:0;background:var(--ok);color:#fff;font-size:18px;font-weight:700;padding:16px;border-radius:16px}
.send:disabled{background:#b8c9bc}
.sec{width:100%;border:0;background:none;color:var(--mut);padding:12px;font-size:14px}
header .tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;border:0;padding:10px 2px;border-radius:12px;background:var(--pri2);color:var(--pri);font-size:14px;font-weight:700}
.tab.on{background:var(--pri);color:#fff}
.tab b{background:#fff;color:var(--pri);border-radius:9px;padding:0 7px;font-size:13px}
.oc{background:#fff;border:1px solid var(--line);border-left:6px solid #f59f00;border-radius:14px;padding:12px;margin-bottom:10px}
.oc.preparando{border-left-color:#1c7ed6}.oc.entregado{border-left-color:var(--ok)}
.oc .h{display:flex;justify-content:space-between;gap:8px;font-size:18px;font-weight:700}
.oc .m{color:var(--mut);font-size:13px;margin:2px 0 8px}
.oc .li{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:2px 0}
.oc .li small{display:block;color:var(--pri);font-size:12px}
.oc .t{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:8px 0;border-top:1px dashed var(--line);padding-top:8px}
.oc .bt{display:flex;gap:6px}
.oc .bt button{border:0;border-radius:10px;padding:12px 8px;font-size:15px;font-weight:700;background:var(--pri2);color:var(--pri)}
.oc .bt .go{flex:2;background:var(--pri);color:#fff}
.tg{font-size:12px;background:var(--pri2);color:var(--pri);border-radius:8px;padding:2px 8px;align-self:center}
#arm{position:fixed;inset:0;z-index:12;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:0 auto}
#arm .hd{padding:12px;border-bottom:1px solid var(--line)}
#arm .hd h2{display:flex;justify-content:space-between;align-items:center}
#arm .hd p{margin:0 0 8px;color:var(--mut);font-size:13px}
#ag{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;align-content:start}
.tp{position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink)}
.tp img,.tp i{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:28px;font-style:normal;color:var(--pri)}
.tp.on{border-color:var(--pri);background:var(--pri2)}
.tp.on::after{content:'✓';position:absolute;top:4px;right:6px;background:var(--pri);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:14px}
.tp em{font-size:11px;color:var(--pri);font-style:normal}
#arm .ft{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.armb{width:100%;border:2px dashed var(--pri);background:var(--pri2);color:var(--pri);font-size:18px;font-weight:700;padding:16px;border-radius:14px;margin-bottom:10px}
.aj{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.aj h3{margin:0 0 8px;font-size:16px}
.aj input,.aj textarea{width:100%;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:4px 0 8px;font-family:inherit}
.aj .b{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:12px;width:100%;font-size:15px;font-weight:700}
.tr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.tr span{flex:1}.tr .off{opacity:.45}
.tr button{border:0;background:var(--pri2);color:var(--pri);border-radius:8px;padding:8px 10px;font-size:14px}
#fiBg{position:fixed;inset:0;background:#0006;z-index:11;display:none}
#fi{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#fi img{width:100%;max-height:240px;object-fit:cover;border-radius:22px 22px 0 0;background:var(--pri2);display:block}
#fi .bd{padding:14px}
#fi h2{margin:0}
#fi .pc{color:var(--pri);font-weight:800;font-size:20px;margin:4px 0 8px}
#fi p{white-space:pre-line;line-height:1.45;margin:0 0 14px}
.row .inf,.row img{cursor:pointer}
#adm{width:100%;height:calc(100dvh - 150px);border:0;border-radius:14px;background:#fff;display:block}
.tr span{min-width:0}.tr button{min-width:42px}
img.th,i.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--pri2);flex:none;display:block}
.th2{width:26px;height:26px;border-radius:6px;object-fit:cover;background:var(--pri2)}
.fs{display:flex;gap:3px;flex:none}
.oc.cobrado{border-left-color:var(--mut)}.oc.cancelado{border-left-color:#adb5bd;opacity:.7}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none;font-size:14px;max-width:90%}
</style>
</head>
<body>
<header>
  <div class="tabs"><button class="tab on" data-v="menu">Menú</button><button class="tab" data-v="ords">Pedidos <b id="oc"></b></button><button class="tab" data-v="his">Historial</button><button class="tab" data-v="aj">Ajustes</button></div>
  <div id="mh"><div class="top"><input id="q" type="search" placeholder="Buscar: f, crepa, oreo…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="x" id="clr" aria-label="Borrar">✕</button></div>
  <div class="chips" id="chips"></div></div>
</header>
<main id="ords" style="display:none"></main>
<main id="aj" style="display:none">
  <div class="seg" id="ajs" style="margin-bottom:10px"><button class="on" data-s="p">Productos</button><button data-s="o">Opciones de armado</button></div>
  <iframe id="adm" title="Productos"></iframe>
  <div id="ajo" style="display:none"></div>
</main>
<main id="his" style="display:none"></main>
<div id="arm"><div class="hd"><h2><span>Armar producto</span><button class="x" id="acl">✕</button></h2>
<div class="seg" id="av"></div><div class="chips" id="agt"></div>
<input id="aq" type="search" placeholder="Buscar…" autocomplete="off" style="width:100%;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-top:6px"></div>
<div id="ag"></div>
<div class="ft" id="aft"><div id="asel" style="font-size:13px;color:var(--mut);margin-bottom:8px;min-height:18px"></div><button class="send" id="aok">Agregar al pedido</button></div></div>
<main id="list"><div class="empty">Cargando menú…</div></main>
<div id="bar"><button id="open" disabled><span id="cnt">Sin productos</span><span id="sum">MX$0.00</span></button></div>

<div id="sheetBg"><div id="sheet">
  <h2 id="sh">Pedido</h2>
  <div id="items"></div>
  <div class="f">Cliente o mesa
    <input id="cli" placeholder="Ej. Ana, pareja de la ventana, Mesa 3" maxlength="40">
    <div class="seg"><button data-t="local" class="on">Aquí</button><button data-t="llevar">Para llevar</button></div>
  </div>
  <div class="f">Mesero<input id="mes" placeholder="Tu nombre" maxlength="20"></div>
  <div class="tot"><span>Total</span><span id="tot">MX$0.00</span></div>
  <button class="send" id="send">Enviar pedido</button>
  <button class="sec" id="back">Seguir agregando</button>
  <button class="sec" id="vaciar">Vaciar pedido</button>
</div></div>
<div id="fiBg"><div id="fi"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, collection, onSnapshot, addDoc, updateDoc, setDoc, deleteDoc, doc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCOqdSCerlqBgpMoanrGbzRbtfo1P0VGU4",
  authDomain: "fresas-d8664.firebaseapp.com",
  projectId: "fresas-d8664",
  storageBucket: "fresas-d8664.firebasestorage.app"
});
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); }
catch (e) { db = initializeFirestore(app, {}); }

const CATS = { crepes:'Crepas', waffles:'Waffles', pancakes:'Pancakes', frappes:'Frappes', fresas:'Fresas', smoothies:'Smoothies', bebidas:'Bebidas', combos:'Combos' };
const $ = id => document.getElementById(id);
const fmt = n => 'MX$' + Number(n || 0).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const img = v => !v ? 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E' : (/^(https?:|data:)/i.test(v) ? v : './' + v);

let all = [], products = [], cat = 'todos', tipo = 'local';
let cart = {}; // id -> {id,nombre,precio,cant,nota}
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); $('mes').value = localStorage.getItem('mesero') || ''; } catch (e) {}
const save = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };

function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

onSnapshot(collection(db, 'productos'), snap => {
  all = snap.docs.map(d => ({ id: d.id, ...d.data() })); products = all.filter(p => p.activo !== false);
  products.forEach(p => { p._n = norm(p.nombre).split(/\s+/); p._d = norm(p.descripcion).split(/[\s,.;]+/); p._f = norm(p.nombre); });
  renderChips(); if (view === 'menu') render();
}, () => { $('list').innerHTML = '<div class="empty">No se pudo cargar el menú. Revisa tu conexión.</div>'; });

const th = (src, c = 'th') => src ? `<img class="${c}" src="${esc(img(src))}" alt="" loading="lazy">` : '';
const thp = src => src ? th(src) : '<i class="th"></i>';
const pic = i => i.img ? th(i.img) : (i.fotos?.length ? `<span class="fs">${i.fotos.slice(0, 4).map(f => th(f, 'th2')).join('')}</span>` : '');
const lines = o => (o.items || []).map(i => `<div class="li"><span style="display:flex;gap:6px;align-items:center">${pic(i)}<span>${i.cant}× ${esc(i.nombre)}${i.nota ? `<small>${esc(i.nota)}</small>` : ''}</span></span><span>${fmt(i.cant * i.precio)}</span></div>`).join('');
let orders = [], view = 'menu', editId = null;
const SIG = { pendiente: ['Preparar', 'preparando'], preparando: ['Entregado', 'entregado'], entregado: ['Cobrar', 'cobrado'] };
const hora = o => o.creadoEn?.toDate ? o.creadoEn.toDate().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';
onSnapshot(query(collection(db, 'comandas'), where('estado', 'in', ['pendiente', 'preparando', 'entregado'])), snap => {
  orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.creadoEn?.seconds ?? 9e9) - (b.creadoEn?.seconds ?? 9e9));
  $('oc').textContent = orders.length || '';
  if (view === 'ords') renderOrds();
});
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let hist = [], hDay = ymd(new Date()), hUnsub = null;
function listenHis() {
  if (hUnsub) hUnsub();
  const a = new Date(hDay + 'T00:00:00'), b = new Date(a.getTime() + 864e5);
  hUnsub = onSnapshot(query(collection(db, 'comandas'), where('creadoEn', '>=', a), where('creadoEn', '<', b)), snap => {
    hist = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => o.estado === 'cobrado' || o.estado === 'cancelado').sort((x, y) => (y.creadoEn?.seconds ?? 0) - (x.creadoEn?.seconds ?? 0));
    if (view === 'his') renderHis();
  });
}
function renderHis() {
  const ok = hist.filter(o => o.estado === 'cobrado'), tot = ok.reduce((x, o) => x + (o.total || 0), 0);
  $('his').innerHTML = `<div class="aj"><input type="date" id="hd" value="${hDay}" style="width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0"><div class="tot" style="margin:10px 0 0"><span>Cobrado (${ok.length})</span><span>${fmt(tot)}</span></div></div>` +
    (hist.length ? hist.map(o => `<div class="oc ${o.estado}"><div class="h"><span>${esc(o.cliente)}</span><span class="tg">${o.estado === 'cancelado' ? 'Cancelado' : (o.tipo === 'llevar' ? 'Para llevar' : 'Aquí')}</span></div>
      <div class="m">${hora(o)} · ${esc(o.mesero || 'sin mesero')}</div>${lines(o)}
      <div class="t"><span>Total</span><span>${fmt(o.total)}</span></div><div class="bt"><button data-r="${o.id}">Reabrir</button></div></div>`).join('') : '<div class="empty">Sin pedidos terminados este día</div>');
}
$('his').onchange = e => { if (e.target.id === 'hd' && e.target.value) { hDay = e.target.value; listenHis(); } };
$('his').onclick = e => { const r = e.target.dataset.r; if (r) { updateDoc(doc(db, 'comandas', r), { estado: 'entregado' }); toast('Pedido reabierto'); } };
function renderOrds() {
  $('ords').innerHTML = orders.length ? orders.map(o => `<div class="oc ${o.estado}">
    <div class="h"><span>${esc(o.cliente)}</span><span class="tg">${o.tipo === 'llevar' ? 'Para llevar' : 'Aquí'}</span></div>
    <div class="m">${hora(o)} · ${esc(o.mesero || 'sin mesero')} · ${esc(o.estado)}</div>
    ${lines(o)}
    <div class="t"><span>Total</span><span>${fmt(o.total)}</span></div>
    <div class="bt"><button class="go" data-s="${o.id}">${SIG[o.estado][0]}</button><button data-e="${o.id}">Editar</button><button data-x="${o.id}">✕</button></div></div>`).join('')
    : '<div class="empty">No hay pedidos activos</div>';
}
function setView(v) {
  view = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('mh').style.display = $('list').style.display = $('bar').style.display = v === 'menu' ? '' : 'none';
  $('aj').style.display = v === 'aj' ? '' : 'none'; $('his').style.display = v === 'his' ? '' : 'none';
  $('ords').style.display = v === 'ords' ? '' : 'none';
  if (v === 'ords') renderOrds(); else if (v === 'aj') { if (!$('adm').getAttribute('src')) $('adm').src = ADMIN_URL; renderAj(); } else if (v === 'his') { listenHis(); renderHis(); } else render();
}
document.querySelector('.tabs').onclick = e => { if (e.target.closest('[data-v]')) setView(e.target.closest('[data-v]').dataset.v); };
$('ords').onclick = e => {
  const s = e.target.dataset.s, x = e.target.dataset.e, c = e.target.dataset.x;
  if (s) { const o = orders.find(o => o.id === s); updateDoc(doc(db, 'comandas', s), { estado: SIG[o.estado][1] }); }
  if (c && confirm('¿Cancelar este pedido?')) updateDoc(doc(db, 'comandas', c), { estado: 'cancelado' });
  if (x) {
    if (!editId && Object.keys(cart).length && !confirm('Tienes un pedido sin enviar. ¿Reemplazarlo?')) return;
    const o = orders.find(o => o.id === x); editId = x; cart = {};
    o.items.forEach((i, n) => { const p = products.find(p => p.nombre === i.nombre); cart[p ? p.id : 'n' + n] = { ...i, id: p ? p.id : 'n' + n }; });
    $('cli').value = o.cliente; $('mes').value = o.mesero || ''; tipo = o.tipo || 'local';
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
    setView('menu'); $('open').click();
  }
};

const mk = (n, p, g) => ({ n, p, g });
const ARM = [
  { id: 'fresas', n: 'Fresas con crema', v: [mk('12 oz', 85, { crema: 1, cobertura: 2, topping: 2 }), mk('16 oz', 95, { crema: 1, cobertura: 2, topping: 3 })] },
  { id: 'crepa', n: 'Arma tu crepa', v: [mk('Sencilla', 85, { fruta: 1, cobertura: 1, topping: 2 }), mk('Premium', 90, { fruta: 2, cobertura: 2, topping: 1 })] },
  { id: 'waffle', n: 'Arma tu waffle', v: [mk('Clásico', 85, { fruta: 1, cobertura: 1, topping: 2 }), mk('Especial', 95, { fruta: 2, cobertura: 2, topping: 1 })] },
  { id: 'donitas', n: 'Donitas', v: [mk('6 donitas', 45, { fruta: 2, cobertura: 2, topping: 1 }), mk('12 donitas', 80, { fruta: 2, cobertura: 3, topping: 3 })] },
  { id: 'mini', n: 'Minipancakes', v: [mk('12 pzas', 70, { fruta: 2, cobertura: 3, topping: 2 }), mk('18 pzas', 95, { fruta: 2, cobertura: 3, topping: 2 })] }
];
const GN = { crema: 'Crema', fruta: 'Frutas', cobertura: 'Coberturas', topping: 'Toppings' };
const GO = ['crema', 'fruta', 'cobertura', 'topping'];
const SEED = {
  topping: ['Almendra', 'Arándano', 'Chocoretas', 'Suspiritos', 'Cranky', "M&M's", 'Lunetas de yogur', 'Chispitas de chocolate', 'Nuez', 'Granillo', 'Ajonjolí'],
  cobertura: ['Mermelada de fresa', 'Mermelada de frambuesa', 'Mermelada de zarzamora', 'Miel maple', 'Miel de abeja', 'Lechera', "Hershey's"],
  fruta: ['Durazno', 'Uva', 'Fresa', 'Plátano'],
  crema: ['Clásica', 'Moka', 'Vainilla']
};
let tops = [], A = null, V = 0, G = '', S = {}, EK = null;
const gOf = t => t.grupo || 'topping';
onSnapshot(collection(db, 'toppings'), snap => {
  tops = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));
  tops.forEach(t => t._n = norm(t.nombre));
  if (view === 'aj') renderAj();
  if ($('arm').style.display === 'flex') renderArm();
});
const lim = () => A.v[V].g;
const gKeys = () => GO.filter(g => lim()[g]);
const nm = id => tops.find(t => t.id === id)?.nombre;
function armTotal() { return A.v[V].p + Object.values(S).flat().reduce((x, id) => x + (Number(tops.find(t => t.id === id)?.extra) || 0), 0); }
function renderArm() {
  $('arm').querySelector('h2 span').textContent = A ? A.n : 'Armar producto';
  ['av', 'agt', 'aq', 'aft'].forEach(i => $(i).style.display = A ? '' : 'none');
  if (!A) { $('ag').innerHTML = ARM.map(a => `<button class="armb" style="grid-column:1/-1;margin:0" data-ap="${a.id}">${a.n}<br><small>${a.v.map(v => v.n + ' ' + fmt(v.p)).join(' · ')}</small></button>`).join(''); return; }
  $('av').innerHTML = A.v.map((v, i) => `<button data-v="${i}" class="${i === V ? 'on' : ''}">${v.n} · ${fmt(v.p)}</button>`).join('');
  $('agt').innerHTML = gKeys().map(g => `<button class="chip${g === G ? ' on' : ''}" data-g="${g}">${GN[g]} ${(S[g] || []).length}/${lim()[g]}</button>`).join('');
  const q = norm($('aq').value).trim(), cur = S[G] || [];
  const act = tops.filter(t => gOf(t) === G && t.activo !== false && (!q || t._n.includes(q)));
  $('ag').innerHTML = act.map(t => `<button class="tp${cur.includes(t.id) ? ' on' : ''}" data-t="${t.id}">${t.imagen ? `<img src="${esc(img(t.imagen))}" alt="" loading="lazy">` : `<i>${esc((t.nombre || '?')[0].toUpperCase())}</i>`}<span>${esc(t.nombre)}</span>${t.extra > 0 ? `<em>+${fmt(t.extra)}</em>` : ''}</button>`).join('') || '<div class="empty" style="grid-column:1/-1">Sin opciones. Cárgalas en Ajustes.</div>';
  $('asel').textContent = gKeys().flatMap(g => (S[g] || []).map(nm)).filter(Boolean).join(' · ');
  $('aok').textContent = `Agregar · ${fmt(armTotal())}`;
}
function openArm() { A = null; V = 0; G = ''; S = {}; $('aq').value = ''; $('arm').style.display = 'flex'; renderArm(); }
function editArm(key) {
  const it = cart[key], a = ARM.find(x => x.id === it?.arm?.a); if (!a) return;
  A = a; V = it.arm.v || 0; S = JSON.parse(JSON.stringify(it.arm.s || {}));
  Object.keys(S).forEach(g => S[g] = S[g].filter(id => tops.some(t => t.id === id)));
  EK = key; G = gKeys()[0]; $('aq').value = ''; $('sheetBg').style.display = 'none'; $('arm').style.display = 'flex'; renderArm();
}
$('acl').onclick = () => {
  if (A && !EK && confirm('¿Salir sin agregar?') === false) return;
  $('arm').style.display = 'none';
  if (EK) { EK = null; $('sheetBg').style.display = 'block'; sheet(); }
};
$('aq').oninput = renderArm;
$('av').onclick = e => {
  const i = e.target.dataset.v; if (i === undefined) return; V = +i;
  Object.keys(S).forEach(g => { if (!lim()[g]) delete S[g]; else S[g] = S[g].slice(0, lim()[g]); });
  if (!lim()[G]) G = gKeys()[0]; renderArm();
};
$('agt').onclick = e => { const g = e.target.dataset.g; if (g) { G = g; $('aq').value = ''; renderArm(); } };
$('ag').onclick = e => {
  const ap = e.target.closest('[data-ap]');
  if (ap) { A = ARM.find(a => a.id === ap.dataset.ap); V = 0; S = {}; G = gKeys()[0]; renderArm(); return; }
  const b = e.target.closest('[data-t]'); if (!b) return;
  const id = b.dataset.t, cur = S[G] || (S[G] = []);
  if (cur.includes(id)) S[G] = cur.filter(x => x !== id);
  else if (cur.length >= lim()[G]) { toast(`Máximo ${lim()[G]}`); return; }
  else { cur.push(id); if (cur.length >= lim()[G]) { const nx = gKeys().find(g => (S[g] || []).length < lim()[g]); if (nx) { G = nx; $('aq').value = ''; } } }
  renderArm();
};
$('aok').onclick = () => {
  if (!A) return;
  const falta = gKeys().filter(g => (S[g] || []).length < lim()[g]).map(g => GN[g].toLowerCase());
  if (falta.length && !confirm('Faltan: ' + falta.join(', ') + '. ¿Agregar así?')) return;
  const v = A.v[V], id = EK || 'arm' + Date.now(), prev = EK ? cart[EK] : null;
  const fotos = gKeys().flatMap(g => S[g] || []).map(i => tops.find(t => t.id === i)?.imagen).filter(Boolean).slice(0, 4);
  const nota = gKeys().filter(g => (S[g] || []).length).map(g => `${GN[g]}: ${S[g].map(nm).filter(Boolean).join(', ')}`).join(' · ');
  cart[id] = { id, nombre: `${A.n} · ${v.n}`, precio: armTotal(), cant: prev?.cant || 1, nota, fotos, arm: { a: A.id, v: V, s: JSON.parse(JSON.stringify(S)) } };
  save(); $('arm').style.display = 'none';
  if (EK) { EK = null; $('sheetBg').style.display = 'block'; sheet(); }
  render(); toast('Listo ✓');
};

const CLOUD = { cloudName: 'n86qnh7r', uploadPreset: 'fresas_unsigned' };
function pickPhoto() {
  return new Promise(res => {
    const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
    f.onchange = async () => {
      const file = f.files[0]; if (!file) return res(null);
      if (file.size > 10 * 1024 * 1024) { toast('La foto pesa más de 10 MB'); return res(null); }
      toast('Subiendo foto…');
      try {
        const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CLOUD.uploadPreset);
        const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD.cloudName}/image/upload`, { method: 'POST', body: fd });
        const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || 'Error');
        res(j.secure_url.replace('/upload/', '/upload/f_auto,q_auto,w_700/'));
      } catch (e) { toast('No se pudo subir: ' + e.message); res(null); }
    };
    f.click();
  });
}
const ADMIN_URL = 'admin.html'; // el admin de productos que ya tienes
let oFil = '';
$('adm').onload = () => { try { const d = $('adm').contentDocument, st = d.createElement('style'); st.textContent = '.adm-x{display:none!important}'; d.head.appendChild(st); } catch (e) {} };
$('ajs').onclick = e => {
  const k = e.target.dataset.s; if (!k) return;
  [...$('ajs').children].forEach(b => b.classList.toggle('on', b.dataset.s === k));
  $('adm').style.display = k === 'p' ? '' : 'none'; $('ajo').style.display = k === 'o' ? '' : 'none';
  if (k === 'o') renderAj();
};
function renderAj() {
  const l = tops.filter(t => !oFil || gOf(t) === oFil);
  $('ajo').innerHTML = `<div class="aj"><h3>Cargar lista inicial</h3><button class="b" id="cs">Cargar toppings, coberturas, frutas y cremas</button><small>Solo agrega las que falten.</small></div>
  <div class="aj"><h3>Agregar opciones</h3><select id="cgp" style="width:100%;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff"><option value="topping">Toppings</option><option value="cobertura">Coberturas</option><option value="fruta">Frutas</option><option value="crema">Cremas</option></select><small>Uno por línea. Con extra: <b>Ferrero, 15</b></small><textarea id="cl" rows="4"></textarea><button class="b" id="ca">Agregar lista</button></div>
  <div class="aj"><h3>Opciones (${l.length})</h3><div class="chips" style="margin-bottom:6px">${[['', 'Todas'], ...GO.map(g => [g, GN[g]])].map(([k, n]) => `<button class="chip${k === oFil ? ' on' : ''}" data-of="${k}">${n}</button>`).join('')}</div>
  ${l.map(t => `<div class="tr">${thp(t.imagen)}<span class="${t.activo === false ? 'off' : ''}">${esc(t.nombre)}<br><small>${GN[gOf(t)]}${t.extra > 0 ? ' · +' + fmt(t.extra) : ''}</small></span><button data-ti="${t.id}" aria-label="Foto">📷</button><button data-tt="${t.id}" aria-label="Mostrar u ocultar">${t.activo === false ? '👁' : '🙈'}</button><button data-td="${t.id}" aria-label="Borrar">🗑</button></div>`).join('') || '<div class="empty">Sin opciones. Toca "Cargar toppings, coberturas…".</div>'}</div>`;
}
$('aj').onclick = async e => {
  const t = e.target, id = t.dataset.ti || t.dataset.tt || t.dataset.td;
  if (t.id === 'cs') {
    t.disabled = true; let n = 0;
    for (const g of Object.keys(SEED)) for (const x of SEED[g]) if (!tops.some(o => gOf(o) === g && norm(o.nombre) === norm(x))) { addDoc(collection(db, 'toppings'), { nombre: x, grupo: g, extra: 0, activo: true, imagen: '' }); n++; }
    toast(n ? `${n} agregadas ✓` : 'Ya estaban todas'); setTimeout(() => t.disabled = false, 1500);
  }
  if (t.id === 'ca') {
    const lines = $('cl').value.split('\n').map(l => l.trim()).filter(Boolean);
    lines.forEach(l => { const [n, x] = l.split(','); addDoc(collection(db, 'toppings'), { nombre: n.trim(), grupo: $('cgp').value, extra: parseFloat(x) || 0, activo: true, imagen: '' }); });
    $('cl').value = ''; toast(`${lines.length} agregados ✓`);
  }
  if (t.dataset.of !== undefined) { oFil = t.dataset.of; renderAj(); }
  if (t.dataset.pt) { const o = all.find(x => x.id === t.dataset.pt); updateDoc(doc(db, 'productos', o.id), { activo: o.activo === false }); }
  if (t.dataset.pe) {
    const o = all.find(x => x.id === t.dataset.pe);
    const pr = prompt(`Precio de ${o.nombre} (MX$):`, o.precio); if (pr === null) return;
    const ds = prompt('Descripción / ingredientes:', o.descripcion || ''); if (ds === null) return;
    updateDoc(doc(db, 'productos', o.id), { precio: parseFloat(pr) || 0, descripcion: ds.trim() }); toast('Producto actualizado ✓');
  }
  if (t.dataset.tt) { const o = tops.find(x => x.id === id); updateDoc(doc(db, 'toppings', id), { activo: o.activo === false }); }
  if (t.dataset.td && confirm('¿Borrar topping?')) deleteDoc(doc(db, 'toppings', id));
  if (t.dataset.ti) { const u = await pickPhoto(); if (u) { updateDoc(doc(db, 'toppings', id), { imagen: u }); toast('Foto guardada ✓'); } }
  if (t.dataset.pf) { const u = await pickPhoto(); if (u) { updateDoc(doc(db, 'productos', t.dataset.pf), { imagen: u }); toast('Foto guardada ✓'); } }
};

function openFi(id) {
  const p = products.find(x => x.id === id); if (!p) return;
  $('fi').innerHTML = `<img src="${esc(img(p.imagen))}" alt=""><div class="bd"><h2>${esc(p.nombre)}</h2><div class="pc">${fmt(p.precio)} · ${esc(CATS[p.categoria] || p.categoria || '')}</div><p>${esc(p.descripcion || 'Sin descripción')}</p>
    <button class="send" data-fa="${p.id}">Agregar al pedido</button><button class="sec" data-fc="1">Cerrar</button></div>`;
  $('fiBg').style.display = 'block';
}
$('fiBg').onclick = e => {
  const a = e.target.dataset.fa;
  if (a) { const p = products.find(x => x.id === a); (cart[a] ||= { id: a, nombre: p.nombre, precio: Number(p.precio) || 0, cant: 0, nota: '', img: p.imagen || '' }).cant++; save(); render(); toast('Agregado ✓'); }
  if (a || e.target.dataset.fc || e.target.id === 'fiBg') $('fiBg').style.display = 'none';
};
function renderChips() {
  const used = ['todos', ...Object.keys(CATS).filter(k => products.some(p => p.categoria === k))];
  $('chips').innerHTML = used.map(k => `<button class="chip${k === cat ? ' on' : ''}" data-c="${k}">${k === 'todos' ? 'Todo' : CATS[k]}</button>`).join('');
}

function search() {
  const toks = norm($('q').value).split(/\s+/).filter(Boolean);
  let res = products.filter(p => cat === 'todos' || p.categoria === cat);
  if (!toks.length) return res.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
  const out = [];
  for (const p of res) {
    let score = 0, ok = true;
    for (const t of toks) {
      if (p._n.some(w => w.startsWith(t))) score += 3;
      else if (p._f.includes(t)) score += 2;
      else if (p._d.some(w => w.startsWith(t))) score += 1;
      else { ok = false; break; }
    }
    if (ok) out.push([score + (p._f.startsWith(toks[0]) ? 2 : 0), p]);
  }
  return out.sort((a, b) => b[0] - a[0]).map(x => x[1]);
}

function render() {
  const r = search();
  const arm = !$('q').value.trim() ? '<button class="armb" id="armb">🍓 Armar producto</button>' : '';
  $('list').innerHTML = arm + (r.length ? r.map(p => `
    <div class="row" data-p="${p.id}"><img src="${esc(img(p.imagen))}" alt="" loading="lazy">
      <div class="inf"><div class="nm">${esc(p.nombre)}</div><div class="ds">${esc(p.descripcion)}</div><div class="pr">${fmt(p.precio)}</div></div>
      <button class="add" data-a="${p.id}" aria-label="Agregar ${esc(p.nombre)}">+${cart[p.id] ? `<b>${cart[p.id].cant}</b>` : ''}</button></div>`).join('')
    : '<div class="empty">Sin resultados</div>');
  bar();
}

function totals() { const v = Object.values(cart); return { n: v.reduce((s, i) => s + i.cant, 0), t: v.reduce((s, i) => s + i.cant * i.precio, 0) }; }
function bar() {
  const { n, t } = totals();
  $('cnt').textContent = n ? `Ver pedido (${n})` : 'Sin productos';
  $('sum').textContent = fmt(t); $('open').disabled = !n;
}

function sheet() {
  const v = Object.values(cart);
  $('sh').textContent = editId ? 'Editar pedido' : 'Pedido'; $('send').textContent = editId ? 'Guardar cambios' : 'Enviar pedido'; $('vaciar').textContent = editId ? 'Cancelar edición' : 'Vaciar pedido';
  $('items').innerHTML = v.map(i => `<div class="it"><div class="l1" style="align-items:center"><span style="display:flex;gap:8px;align-items:center">${pic(i)}${esc(i.nombre)}</span><span>${fmt(i.cant * i.precio)}</span></div>
    <div class="qty"><button data-m="${i.id}">−</button><span>${i.cant}</span><button data-p="${i.id}">+</button><span style="color:var(--mut);font-weight:400;font-size:13px">${fmt(i.precio)} c/u</span>${i.arm ? `<button data-ea="${i.id}" style="width:auto;padding:0 12px;font-size:14px;margin-left:auto">✎ Cambiar</button>` : ''}</div>
    <input data-n="${i.id}" placeholder="Nota (sin crema, alergia…)" value="${esc(i.nota || '')}" maxlength="200"></div>`).join('');
  $('tot').textContent = fmt(totals().t);
  if (!v.length) { $('sheetBg').style.display = 'none'; }
  bar();
}

$('q').addEventListener('input', render);
$('clr').onclick = () => { $('q').value = ''; render(); $('q').focus(); };
$('chips').onclick = e => { const c = e.target.dataset.c; if (c) { cat = c; renderChips(); render(); } };
$('list').onclick = e => {
  if (e.target.closest('#armb')) { openArm(); return; }
  const row = e.target.closest('.row');
  if (row && !e.target.closest('[data-a]')) { openFi(row.dataset.p); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const p = products.find(x => x.id === b.dataset.a); if (!p) return;
  (cart[p.id] ||= { id: p.id, nombre: p.nombre, precio: Number(p.precio) || 0, cant: 0, nota: '', img: p.imagen || '' }).cant++;
  save(); render(); if (navigator.vibrate) navigator.vibrate(15);
};
$('open').onclick = () => { $('sheetBg').style.display = 'block'; sheet(); };
$('back').onclick = () => $('sheetBg').style.display = 'none';
$('sheetBg').onclick = e => { if (e.target.id === 'sheetBg') $('sheetBg').style.display = 'none'; };
$('items').onclick = e => {
  const m = e.target.dataset.m, p = e.target.dataset.p;
  if (e.target.dataset.ea) { editArm(e.target.dataset.ea); return; }
  if (p) cart[p].cant++;
  if (m && --cart[m].cant <= 0) delete cart[m];
  if (p || m) { save(); sheet(); render(); }
};
$('items').oninput = e => { const id = e.target.dataset.n; if (id && cart[id]) { cart[id].nota = e.target.value; save(); } };
document.querySelector('.seg').onclick = e => {
  if (!e.target.dataset.t) return; tipo = e.target.dataset.t;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
};
$('vaciar').onclick = () => {
  if (editId) { editId = null; cart = {}; save(); $('cli').value = ''; $('sheetBg').style.display = 'none'; setView('ords'); return; }
  if (confirm('¿Vaciar todo el pedido?')) { cart = {}; save(); sheet(); render(); }
};

$('send').onclick = async () => {
  const cliente = $('cli').value.trim(), mesero = $('mes').value.trim();
  if (!cliente) { toast('Escribe el cliente o la mesa'); $('cli').focus(); return; }
  const items = Object.values(cart).map(i => ({ nombre: i.nombre, precio: i.precio, cant: i.cant, nota: i.nota || '', img: i.img || '', fotos: i.fotos || [], arm: i.arm || null }));
  if (!items.length) return;
  $('send').disabled = true;
  try { localStorage.setItem('mesero', mesero); } catch (e) {}
  // Con caché offline, addDoc queda guardado y se sube solo al volver el internet
  const data = { cliente, tipo, mesero, items, total: totals().t };
  const fail = () => toast('No se pudo subir; se reintentará');
  if (editId) updateDoc(doc(db, 'comandas', editId), data).catch(fail);
  else addDoc(collection(db, 'comandas'), { ...data, estado: 'pendiente', creadoEn: serverTimestamp() }).catch(fail);
  const was = editId; editId = null;
  cart = {}; save(); $('cli').value = ''; $('sheetBg').style.display = 'none';
  $('send').disabled = false; toast(was ? 'Cambios guardados ✓' : 'Pedido enviado ✓');
  was ? setView('ords') : render();
};
</script>
</body>
</html>
